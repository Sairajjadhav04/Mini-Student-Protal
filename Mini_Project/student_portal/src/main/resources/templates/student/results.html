<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Results</title>

    <link rel="stylesheet" th:href="@{/css/result.css}">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <h2>Student Portal</h2>

        <nav>

            <a th:href="@{/student/dashboard}">
                Dashboard
            </a>

            <a th:href="@{/student/profile}">
                Profile
            </a>

            <a th:href="@{/student/subjects}">
                Subjects
            </a>

            <a th:href="@{/student/attendance}">
                Attendance
            </a>

            <a th:href="@{/student/results}" class="active">
                Results
            </a>

            <a th:href="@{/student/assignments}">
                Assignments
            </a>

        </nav>

        <form th:action="@{/logout}" method="post">

            <button type="submit">
                Logout
            </button>

        </form>

    </aside>


    <main class="content">

        <h1>My Results</h1>

        <p class="subtitle">
            View your marks subject-wise
        </p>

        <section class="results-card">

            <table>

                <thead>

                <tr>

                    <th>Subject Code</th>

                    <th>Subject</th>

                    <th>Marks</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="m : ${marks}">

                    <td th:text="${m.subject.code}">
                        -
                    </td>

                    <td th:text="${m.subject.name}">
                        -
                    </td>

                    <td>

                        <span
                                class="marks"
                                th:text="${m.marks}">
                            0
                        </span>

                    </td>

                </tr>

                </tbody>

            </table>


            <div
                    class="no-data"
                    th:if="${#lists.isEmpty(marks)}">

                No marks available.

            </div>

        </section>

    </main>

</div>

</body>

</html>
