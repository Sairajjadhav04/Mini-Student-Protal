<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Take Attendance</title>

    <link rel="stylesheet"
          th:href="@{/css/faculty.css}">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <h2>Student Portal</h2>

        <nav>

            <a th:href="@{/faculty/dashboard}">
                Dashboard
            </a>

            <a th:href="@{/faculty/profile}">
                Profile
            </a>

            <a th:href="@{/faculty/students}">
                Students
            </a>

            <a th:href="@{/faculty/attendance}"
               class="active">
                Attendance
            </a>

            <a th:href="@{/faculty/marks}">
                Marks
            </a>

            <a th:href="@{/faculty/assignments}">
                Assignments
            </a>

        </nav>

        <form th:action="@{/logout}"
              method="post">

            <button type="submit">
                Logout
            </button>

        </form>

    </aside>


    <main class="content">

        <h1>Take Attendance</h1>

        <p class="welcome">
            Mark students Present or Absent.
        </p>


        <!-- SUBJECT -->

        <section class="faculty-info">

            <h2>Select Subject</h2>

            <form th:action="@{/faculty/attendance}"
                  method="get">

                <select name="subjectId"
                        required>

                    <option value="">
                        Select Subject
                    </option>

                    <option
                            th:each="subject : ${subjects}"
                            th:value="${subject.id}"
                            th:text="${subject.code + ' - ' + subject.name}"
                            th:selected="${selectedSubject != null and selectedSubject.id == subject.id}">
                    </option>

                </select>

                <button type="submit">
                    Load Students
                </button>

            </form>

        </section>


        <!-- ATTENDANCE -->

        <section class="faculty-info"
                 th:if="${selectedSubject != null}">

            <h2
                    th:text="${'Attendance - ' + selectedSubject.name}">
                Attendance
            </h2>


            <p th:if="${param.saved}"
               class="success">

                Attendance saved successfully.

            </p>


            <form th:action="@{/faculty/attendance}"
                  method="post">

                <input type="hidden"
                       name="subjectId"
                       th:value="${selectedSubject.id}">


                <table>

                    <thead>

                    <tr>

                        <th>Student</th>

                        <th>Roll Number</th>

                        <th>Current Attendance</th>

                        <th>Today's Attendance</th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="student : ${students}">

                        <td
                                th:text="${student.fullName}">
                            Student
                        </td>


                        <td
                                th:text="${student.rollNumber}">
                            -
                        </td>


                        <td>

                            <span
                                    th:if="${attendanceByStudent.containsKey(student.id)}"

                                    th:text="${#numbers.formatDecimal(attendanceByStudent.get(student.id).percentage, 1, 2) + '%'}">

                                0%

                            </span>


                            <span
                                    th:unless="${attendanceByStudent.containsKey(student.id)}">

                                0%

                            </span>

                        </td>


                        <td>

                            <label>

                                <input
                                        type="radio"
                                        th:name="${'status_' + student.id}"
                                        value="PRESENT"
                                        required>

                                Present

                            </label>


                            <label>

                                <input
                                        type="radio"
                                        th:name="${'status_' + student.id}"
                                        value="ABSENT">

                                Absent

                            </label>

                        </td>

                    </tr>

                    </tbody>

                </table>


                <button type="submit">
                    Save Attendance
                </button>

            </form>

        </section>


        <section class="faculty-info"
                 th:if="${selectedSubject == null}">

            <p>
                No subjects are assigned to you.
            </p>

        </section>

    </main>

</div>

</body>
</html>
