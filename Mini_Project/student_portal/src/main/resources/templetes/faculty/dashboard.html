<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty Dashboard</title>

    <link rel="stylesheet" th:href="@{/css/faculty.css}">
</head>

<body>

<div class="layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>Student Portal</h2>

        <nav>

            <a th:href="@{/faculty/dashboard}" class="active">
                Dashboard
            </a>

            <a th:href="@{/faculty/profile}">
                Profile
            </a>

            <a th:href="@{/faculty/students}">
                Students
            </a>

            <a th:href="@{/faculty/attendance}">
                Attendance
            </a>

            <a th:href="@{/faculty/marks}">
                Marks
            </a>

            <a th:href="@{/faculty/assignments}">
                Assignments
            </a>

        </nav>

        <form th:action="@{/logout}" method="post">

            <button type="submit">
                Logout
            </button>

        </form>

    </aside>


    <!-- Main Content -->

    <main class="content">

        <h1>Faculty Dashboard</h1>

        <p class="welcome">
            Welcome,
            <strong th:text="${faculty.fullName}">
                Faculty
            </strong>
        </p>


        <!-- Faculty Information -->

        <section class="faculty-info">

            <h2>Faculty Information</h2>

            <div class="info-grid">

                <div>
                    <span>Name</span>

                    <strong th:text="${faculty.fullName}">
                        -
                    </strong>
                </div>

                <div>
                    <span>Username</span>

                    <strong th:text="${faculty.username}">
                        -
                    </strong>
                </div>

                <div>
                    <span>Email</span>

                    <strong th:text="${faculty.email}">
                        -
                    </strong>
                </div>

                <div>
                    <span>Department</span>

                    <strong th:text="${faculty.department.name}">
                        -
                    </strong>
                </div>

            </div>

        </section>


        <!-- Quick Links -->

        <section class="section">

            <h2>Faculty Modules</h2>

            <div class="quick-links">

                <a th:href="@{/faculty/students}">
                    Students
                </a>

                <a th:href="@{/faculty/attendance}">
                    Attendance
                </a>

                <a th:href="@{/faculty/marks}">
                    Marks
                </a>

                <a th:href="@{/faculty/assignments}">
                    Assignments
                </a>

            </div>

        </section>

    </main>

</div>

</body>

</html>
