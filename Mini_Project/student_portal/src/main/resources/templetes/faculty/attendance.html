<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Attendance</title>

    <link rel="stylesheet" th:href="@{/css/faculty.css}">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <h2>Student Portal</h2>

        <nav>

            <a th:href="@{/faculty/dashboard}">
                Dashboard
            </a>

            <a th:href="@{/faculty/profile}">
                Profile
            </a>

            <a th:href="@{/faculty/students}">
                Students
            </a>

            <a th:href="@{/faculty/attendance}" class="active">
                Attendance
            </a>

            <a th:href="@{/faculty/marks}">
                Marks
            </a>

            <a th:href="@{/faculty/assignments}">
                Assignments
            </a>

        </nav>

        <form th:action="@{/logout}" method="post">

            <button type="submit">
                Logout
            </button>

        </form>

    </aside>


    <main class="content">

        <h1>Manage Attendance</h1>

        <p class="welcome">
            Add or update student attendance
        </p>


        <section class="faculty-info">

            <h2>Attendance Records</h2>

            <table>

                <thead>

                <tr>

                    <th>Student</th>

                    <th>Roll Number</th>

                    <th>Subject</th>

                    <th>Attendance</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="a : ${attendance}">

                    <td th:text="${a.student.fullName}">
                        -
                    </td>

                    <td th:text="${a.student.rollNumber}">
                        -
                    </td>

                    <td th:text="${a.subject.name}">
                        -
                    </td>

                    <td th:text="${a.percentage + '%'}">
                        0%
                    </td>

                </tr>

                </tbody>

            </table>

            <div
                    class="no-data"
                    th:if="${#lists.isEmpty(attendance)}">

                No attendance records available.

            </div>

        </section>

    </main>

</div>

</body>

</html>
