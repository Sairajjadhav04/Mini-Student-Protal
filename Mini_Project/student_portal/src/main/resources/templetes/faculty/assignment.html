<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Assignments</title>

    <link rel="stylesheet" th:href="@{/css/faculty.css}">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <h2>Student Portal</h2>

        <nav>

            <a th:href="@{/faculty/dashboard}">
                Dashboard
            </a>

            <a th:href="@{/faculty/profile}">
                Profile
            </a>

            <a th:href="@{/faculty/students}">
                Students
            </a>

            <a th:href="@{/faculty/attendance}">
                Attendance
            </a>

            <a th:href="@{/faculty/marks}">
                Marks
            </a>

            <a th:href="@{/faculty/assignments}" class="active">
                Assignments
            </a>

        </nav>

        <form th:action="@{/logout}" method="post">

            <button type="submit">
                Logout
            </button>

        </form>

    </aside>


    <main class="content">

        <h1>Manage Assignments</h1>

        <p class="welcome">
            View assignments for your subjects
        </p>


        <section class="faculty-info">

            <h2>Assignment List</h2>

            <table>

                <thead>

                <tr>

                    <th>Title</th>

                    <th>Subject</th>

                    <th>Description</th>

                    <th>Due Date</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="assignment : ${assignments}">

                    <td th:text="${assignment.title}">
                        -
                    </td>

                    <td th:text="${assignment.subject.name}">
                        -
                    </td>

                    <td th:text="${assignment.description}">
                        -
                    </td>

                    <td th:text="${assignment.dueDate}">
                        -
                    </td>

                </tr>

                </tbody>

            </table>


            <div
                    class="no-data"
                    th:if="${#lists.isEmpty(assignments)}">

                No assignments available.

            </div>

        </section>

    </main>

</div>

</body>

</html>
