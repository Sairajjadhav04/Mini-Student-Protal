<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Subjects</title>

    <link rel="stylesheet" th:href="@{/css/admin.css}">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <h2>Student Portal</h2>

        <nav>

            <a th:href="@{/admin/dashboard}">
                Dashboard
            </a>

            <a th:href="@{/admin/students}">
                Students
            </a>

            <a th:href="@{/admin/faculty}">
                Faculty
            </a>

            <a th:href="@{/admin/subjects}" class="active">
                Subjects
            </a>

        </nav>

        <form th:action="@{/logout}" method="post">

            <button type="submit">
                Logout
            </button>

        </form>

    </aside>

    <main class="content">

        <h1>Manage Subjects</h1>

        <p class="welcome">
            Add and view subjects
        </p>

        <div th:if="${param.saved}" class="success">
            Subject added successfully.
        </div>

        <section class="form-card">

            <h2>Add Subject</h2>

            <form th:action="@{/admin/subjects}" method="post">

                <div class="form-grid">

                    <div class="form-group">

                        <label>Subject Code</label>

                        <input
                                type="text"
                                name="code"
                                placeholder="Example: FSJ"
                                required>

                    </div>

                    <div class="form-group">

                        <label>Subject Name</label>

                        <input
                                type="text"
                                name="name"
                                placeholder="Enter subject name"
                                required>

                    </div>

                    <div class="form-group">

                        <label>Semester</label>

                        <input
                                type="number"
                                name="semester"
                                min="1"
                                max="8"
                                placeholder="Enter semester"
                                required>

                    </div>

                    <div class="form-group">

                        <label>Department</label>

                        <select name="departmentId" required>

                            <option value="">
                                Select Department
                            </option>

                            <option
                                    th:each="department : ${departments}"
                                    th:value="${department.id}"
                                    th:text="${department.name}">

                                Department

                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Faculty</label>

                        <select name="facultyId" required>

                            <option value="">
                                Select Faculty
                            </option>

                            <option
                                    th:each="f : ${faculty}"
                                    th:value="${f.id}"
                                    th:text="${f.fullName}">

                                Faculty

                            </option>

                        </select>

                    </div>

                </div>

                <button type="submit" class="primary-button">
                    Add Subject
                </button>

            </form>

        </section>

        <section class="info-card">

            <h2>Subject List</h2>

            <div class="table-container">

                <table>

                    <thead>

                    <tr>

                        <th>Code</th>
                        <th>Subject</th>
                        <th>Semester</th>
                        <th>Department</th>
                        <th>Faculty</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="subject : ${subjects}">

                        <td th:text="${subject.code}">
                            -
                        </td>

                        <td th:text="${subject.name}">
                            -
                        </td>

                        <td th:text="${subject.semester}">
                            -
                        </td>

                        <td th:text="${subject.department.name}">
                            -
                        </td>

                        <td th:text="${subject.faculty.fullName}">
                            -
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <div class="no-data" th:if="${#lists.isEmpty(subjects)}">
                No subjects available.
            </div>

        </section>

    </main>

</div>

</body>

</html>
