<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Faculty</title>

    <link rel="stylesheet" th:href="@{/css/admin.css}">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <h2>Student Portal</h2>

        <nav>

            <a th:href="@{/admin/dashboard}">
                Dashboard
            </a>

            <a th:href="@{/admin/students}">
                Students
            </a>

            <a th:href="@{/admin/faculty}" class="active">
                Faculty
            </a>

            <a th:href="@{/admin/subjects}">
                Subjects
            </a>

        </nav>

        <form th:action="@{/logout}" method="post">

            <button type="submit">
                Logout
            </button>

        </form>

    </aside>

    <main class="content">

        <h1>Manage Faculty</h1>

        <p class="welcome">
            Add and view registered faculty
        </p>

        <div th:if="${param.saved}" class="success">
            Faculty added successfully.
        </div>

        <section class="form-card">

            <h2>Add Faculty</h2>

            <form th:action="@{/admin/faculty}" method="post">

                <div class="form-grid">

                    <div class="form-group">

                        <label>Username</label>

                        <input
                                type="text"
                                name="username"
                                placeholder="Enter username"
                                required>

                    </div>

                    <div class="form-group">

                        <label>Password</label>

                        <input
                                type="password"
                                name="password"
                                placeholder="Enter password"
                                required>

                    </div>

                    <div class="form-group">

                        <label>Full Name</label>

                        <input
                                type="text"
                                name="fullName"
                                placeholder="Enter full name"
                                required>

                    </div>

                    <div class="form-group">

                        <label>Email</label>

                        <input
                                type="email"
                                name="email"
                                placeholder="Enter email"
                                required>

                    </div>

                    <div class="form-group">

                        <label>Department</label>

                        <select name="departmentId" required>

                            <option value="">
                                Select Department
                            </option>

                            <option
                                    th:each="department : ${departments}"
                                    th:value="${department.id}"
                                    th:text="${department.name}">

                                Department

                            </option>

                        </select>

                    </div>

                </div>

                <button type="submit" class="primary-button">
                    Add Faculty
                </button>

            </form>

        </section>

        <section class="info-card">

            <h2>Faculty List</h2>

            <div class="table-container">

                <table>

                    <thead>

                    <tr>

                        <th>Name</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Department</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="f : ${faculty}">

                        <td th:text="${f.fullName}">
                            -
                        </td>

                        <td th:text="${f.username}">
                            -
                        </td>

                        <td th:text="${f.email}">
                            -
                        </td>

                        <td th:text="${f.department.name}">
                            -
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <div class="no-data" th:if="${#lists.isEmpty(faculty)}">
                No faculty available.
            </div>

        </section>

    </main>

</div>

</body>

</html>
